<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Contracts — Wilnor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; color: #222; margin-bottom: 6px; }
    p { color: #666; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
    input[type="number"]:focus { border-color: #4f46e5; }
    button { width: 100%; margin-top: 16px; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #3730a3; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
    .status.success { background: #dcfce7; color: #166534; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .hint { margin-top: 20px; font-size: 12px; color: #999; text-align: center; margin-bottom: 0; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 32px; width: 90%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal h2 { font-size: 18px; color: #222; margin-bottom: 8px; }
    .modal p { margin-bottom: 0; }
    .modal-names { margin: 20px 0; background: #f5f3ff; border-radius: 8px; padding: 16px; }
    .modal-names .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #7c3aed; font-weight: bold; margin-bottom: 4px; }
    .modal-names .name { font-size: 16px; font-weight: bold; color: #222; }
    .modal-names .divider { border: none; border-top: 1px solid #e9d5ff; margin: 12px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .modal-actions button { margin-top: 0; }
    .btn-cancel { background: #f3f4f6; color: #374151; }
    .btn-cancel:hover { background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 Generate Contracts</h1>
    <p>Enter the row number from the Master File sheet for the client you want to generate contracts for.</p>

    <label for="row">Row Number</label>
    <input type="number" id="row" min="2" placeholder="e.g. 5" autofocus>

    <button id="btn" onclick="lookup()">Generate Contracts</button>
    <div class="status" id="status"></div>
    <p class="hint">You'll receive an email with links to all 5 documents once done.</p>
  </div>

  <!-- Confirmation modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Confirm contract generation</h2>
      <p style="color:#666;font-size:14px;">You're about to generate and send contracts for:</p>
      <div class="modal-names">
        <div class="label">Employer</div>
        <div class="name" id="modal-employer">—</div>
        <hr class="divider">
        <div class="label">Helper</div>
        <div class="name" id="modal-maid">—</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button onclick="generate()">Yes, Generate</button>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://n8n.cyllabs.com/webhook/generate-contracts';
    const LOOKUP_URL  = 'https://n8n.cyllabs.com/webhook/lookup-row';

    let pendingRow = null;

    async function lookup() {
      const rowInput = document.getElementById('row');
      const row = parseInt(rowInput.value);
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      status.className = 'status';
      status.textContent = '';

      if (!row || row < 2) {
        status.className = 'status error';
        status.textContent = 'Please enter a valid row number (2 or higher).';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Looking up...';

      try {
        const res = await fetch(LOOKUP_URL + '?row=' + row);
        if (!res.ok) throw new Error('Lookup returned ' + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        pendingRow = row;
        document.getElementById('modal-employer').textContent = data.employer || '(unknown)';
        document.getElementById('modal-maid').textContent     = data.maid     || '(unknown)';
        document.getElementById('modal').classList.add('open');
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Could not look up names: ' + err.message;
        pendingRow = row;
        document.getElementById('modal-employer').textContent = '(could not load — row ' + row + ')';
        document.getElementById('modal-maid').textContent     = '(could not load)';
        document.getElementById('modal').classList.add('open');
      }

      btn.disabled = false;
      btn.textContent = 'Generate Contracts';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      pendingRow = null;
    }

    async function generate() {
      closeModal();
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.textContent = 'Generating...';
      status.className = 'status';
      status.textContent = '';

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ row: pendingRow })
        });

        if (res.ok) {
          status.className = 'status success';
          status.textContent = '✓ Contracts are being generated for row ' + pendingRow + '. Check your email shortly.';
          document.getElementById('row').value = '';
        } else {
          throw new Error('Server returned ' + res.status);
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Something went wrong: ' + err.message;
      }

      btn.disabled = false;
      btn.textContent = 'Generate Contracts';
      pendingRow = null;
    }

    document.getElementById('row').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookup();
    });

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
